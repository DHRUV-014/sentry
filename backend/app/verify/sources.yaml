# Trusted official sources for verification. Keys under `institutions` are the canonical names
# produced by app/entities/institutions.yaml, so live-call claims and the manual form resolve to
# the same entry. Only institutions listed here are ever searched (privacy: a free-text name
# that doesn't resolve to a listed institution is never sent to TinyFish).
#
# Banks are moving to RBI's `.bank.in` domains; both old and new official domains are listed.

advisory_domains:
  - cybercrime.gov.in
  - rbi.org.in
  - sachet.rbi.org.in
  - pib.gov.in
  - npci.org.in
  - mha.gov.in
  - cert-in.org.in
  - dot.gov.in

institutions:
  State Bank of India: {domains: [sbi.co.in, onlinesbi.sbi, sbi.bank.in, bank.sbi]}
  HDFC Bank: {domains: [hdfcbank.com, hdfc.bank.in]}
  ICICI Bank: {domains: [icicibank.com, icici.bank.in]}
  Axis Bank: {domains: [axisbank.com, axis.bank.in]}
  Punjab National Bank: {domains: [pnbindia.in, pnb.bank.in]}
  Bank of Baroda: {domains: [bankofbaroda.in, bankofbaroda.bank.in]}
  Kotak Mahindra Bank: {domains: [kotak.com, kotak.bank.in]}
  Reserve Bank of India: {domains: [rbi.org.in]}
  FedEx: {domains: [fedex.com]}
  DHL: {domains: [dhl.com]}
  Blue Dart: {domains: [bluedart.com]}
  India Post: {domains: [indiapost.gov.in]}
  Airtel: {domains: [airtel.in]}
  Jio: {domains: [jio.com]}
  BSNL: {domains: [bsnl.co.in]}
  Telecom Regulatory Authority of India: {domains: [trai.gov.in]}
  Department of Telecommunications: {domains: [dot.gov.in]}
  Central Bureau of Investigation: {domains: [cbi.gov.in]}
  Enforcement Directorate: {domains: [enforcementdirectorate.gov.in]}
  Narcotics Control Bureau: {domains: [narcoticsindia.nic.in]}
  Customs: {domains: [cbic.gov.in]}
  Income Tax Department: {domains: [incometax.gov.in, incometaxindia.gov.in]}
  Mumbai Police: {domains: [mumbaipolice.gov.in]}
  Delhi Police: {domains: [delhipolice.gov.in]}
  Police (Cyber Crime): {domains: [cybercrime.gov.in]}
  Securities and Exchange Board of India: {domains: [sebi.gov.in]}

# Query used to find an institution's helpline on its own domain.
contact_query: "{name} customer care helpline toll free number"
# Words that mark a line on an official page as a contact number.
contact_keywords: [customer care, helpline, toll free, toll-free, call us, contact us, phone banking, 24x7]
# Ranking among numbers found on official pages: general customer care / phone banking first,
# product-specific helplines (home loans, cards, insurance...) last. Every number found is
# still treated as official for MATCH/MISMATCH.
contact_strong_keywords: [customer care, phone banking, phonebanking, helpline, contact centre, contact center]
contact_deprioritize: [homeloan, home-loan, home loan, credit-card, credit card, loan, insurance, mutual-fund, demat, nri, securities, life, forex, terms-and-conditions, .pdf]

# Advisory search: the first scenario whose conditions match the form is used. Queries are generic
# (they never contain anything the user typed) and are restricted to advisory_domains.
scenarios:
  - id: digital_arrest
    when: {identity_types: [police, government], asked_to_any: [video_call, go_alone, secrecy, money]}
    query: "digital arrest fraud advisory video call police CBI"
  - id: bank_otp
    when: {identity_types: [bank], asked_to_any: [otp, install_app]}
    query: "never share OTP bank fraud advisory"
  - id: courier_parcel
    when: {identity_types: [courier], asked_to_any: [money, otp, video_call]}
    query: "courier parcel scam drugs customs fraud advisory"
  - id: telecom_sim
    when: {identity_types: [telecom], asked_to_any: [money, otp, install_app, video_call]}
    query: "SIM disconnection mobile number misuse fraud call advisory"
  - id: remote_access
    when: {identity_types: [bank, company, telecom], asked_to_any: [install_app]}
    query: "remote access app screen sharing fraud advisory"
  - id: upi_payment
    when: {identity_types: [], asked_to_any: [money]}
    query: "UPI payment fraud advisory do not send money to unknown callers"
  - id: generic
    when: {identity_types: [], asked_to_any: []}
    query: "phone call fraud advisory report cybercrime 1930"

# Public-report search terms appended to a phone / UPI / URL.
report_query: '"{value}" fraud OR scam'
report_words: [fraud, scam, fake, cheat, complaint, spam, धोखा, ठगी]
